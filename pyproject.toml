[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinymem"
version = "0.1.0"
description = "Adaptive discrete memory experiments for small language models"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pyarrow>=18",
  "PyYAML>=6.0",
  "torch>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
research = [
    "transformers==5.16.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
